name: smoke

# A minimal, dependency-free smoke test: the dashboard generator is pure Python
# standard library, so this just proves it still builds the shipped sample into
# a non-empty HTML report on a clean machine.

# ⚠️ NE indítsd minden pushra: ezt a repót egy ötpercenkénti cron frissíti, és
# minden adat-commit külön futást indítana. A GitHub jobonként egy teljes percre
# kerekít felfelé — mérve 2026-09-07: 682 szeptemberi futás, ~2000 számlázott
# perc, a havi keret 90%-a. Az adat-commitok ezért `[skip ci]`-t kapnak, itt
# pedig csak a KÓD változása és a kézi indítás számít.
on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/**"
      - "*.sh"
  pull_request:
  workflow_dispatch:

jobs:
  build-sample-dashboard:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A windows-láb KIESETT (2026-09-07): a füstpróba tiszta Python
        # szabványkönyvtár, platformfüggetlen — a Windows viszont KÉTSZERESEN
        # számít a percekben. Ha egyszer platformfüggő kód kerül ide, tedd
        # vissza, de akkor is csak PR-re.
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run test suite
        run: python -m pytest -q

      - name: Check Git Bash runner syntax
        shell: bash
        run: bash -n codex-usage-check.sh

      - name: Build the sample dashboard
        run: python build_dashboard.py sample/2026-05.jsonl

      - name: Assert the report was produced
        run: python -c "from pathlib import Path; p = Path('sample/2026-05.html'); size = p.stat().st_size; assert size > 0; print(f'built {p} ({size} bytes)')"
